name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            artifact: desktop-macos
          - name: Windows
            runner: windows-latest
            artifact: desktop-windows
          - name: Linux
            runner: ubuntu-24.04
            artifact: desktop-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build desktop application
        if: runner.os != 'Windows'
        shell: bash
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            wails build -clean -tags webkit2_41 \
              -ldflags "-X main.version=${GITHUB_REF_NAME}"
          else
            wails build -clean -ldflags "-X main.version=${GITHUB_REF_NAME}"
          fi
          ./build/bundle-helper.sh "${GITHUB_REF_NAME}" build/bin

      - name: Build desktop application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          $versionFlag = "-X main.version=$env:GITHUB_REF_NAME"
          wails build -clean -ldflags $versionFlag
          New-Item -ItemType Directory -Force -Path build/bin | Out-Null
          go build -trimpath -ldflags "-s -w $versionFlag" `
            -o "build/bin/kubeloop-helper.exe" ./cmd/kubeloop-helper

      - name: Package desktop application
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          arch="$(go env GOARCH)"
          os_name="$(go env GOOS)"
          tar -C build/bin -czf "dist/kubeloop-${os_name}-${arch}.tar.gz" .

      - name: Package desktop application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arch = go env GOARCH
          Compress-Archive -Path "build/bin/*" -DestinationPath "dist/kubeloop-windows-$arch.zip"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  gateway:
    name: Gateway (linux/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Gateway
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/kubeloop-gateway-linux-${GOARCH}" \
            ./cmd/kubeloop-gateway

      - name: Upload Gateway artifact
        uses: actions/upload-artifact@v7
        with:
          name: gateway-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  gateway-image:
    name: Publish Gateway image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/gateway
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/gateway.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs:
      - desktop
      - gateway
      - gateway-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "KubeLoop ${GITHUB_REF_NAME}"
