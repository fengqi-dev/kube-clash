name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            artifact: desktop-darwin-arm64
          - name: macOS amd64
            runner: macos-15-intel
            artifact: desktop-darwin-amd64
          - name: Windows amd64
            runner: windows-latest
            artifact: desktop-windows-amd64
          - name: Windows arm64
            runner: windows-11-arm
            artifact: desktop-windows-arm64
          - name: Linux amd64
            runner: ubuntu-24.04
            artifact: desktop-linux-amd64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            artifact: desktop-linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            rpm

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync product version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          parts = [p for p in version.split(".") if p]
          while len(parts) < 3:
              parts.append("0")
          product_version = ".".join(parts[:3])

          path = pathlib.Path("wails.json")
          data = json.loads(path.read_text())
          data.setdefault("info", {})["productVersion"] = product_version
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"productVersion={product_version}")
          PY

      - name: Build desktop application
        if: runner.os != 'Windows'
        shell: bash
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            wails build -clean -tags webkit2_41 \
              -ldflags "-X main.version=${GITHUB_REF_NAME}"
          else
            wails build -clean -ldflags "-X main.version=${GITHUB_REF_NAME}"
          fi

      - name: Build desktop application
        if: runner.os == 'Windows'
        shell: bash
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          wails build -clean -nsis -ldflags "-X main.version=${GITHUB_REF_NAME}"

      - name: Package desktop application
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: ./build/package-desktop.sh

      - name: Package desktop application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arch = (go env GOARCH).Trim()
          Compress-Archive -Path "build/bin/KubeLoop.exe" -DestinationPath "dist/kubeloop-windows-$arch.zip"
          $installer = Get-ChildItem "build/bin/*-installer.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found in build/bin"
          }
          Copy-Item $installer.FullName "dist/kubeloop-windows-$arch-installer.exe"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  gateway:
    name: Gateway (linux/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Gateway
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/kubeloop-gateway-linux-${GOARCH}" \
            ./cmd/kubeloop-gateway

      - name: Upload Gateway artifact
        uses: actions/upload-artifact@v7
        with:
          name: gateway-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  gateway-image:
    name: Publish Gateway image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/gateway
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/gateway.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs:
      - desktop
      - gateway
      - gateway-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Download gateway artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: gateway-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Hyphenated tags (v1.1.0-rc.1) are GitHub pre-releases.
          # Plain vX.Y.Z can still be pre-created with: gh release create TAG --prerelease
          prerelease_args=()
          if [[ "${tag}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Re-runs / rebuilt matrices: replace assets on the existing release.
            gh release upload "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "KubeLoop ${tag}" \
              "${prerelease_args[@]}"
          fi
