name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  go:
    name: Go
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Run unit tests
        run: go test -tags webkit2_41 ./...

      - name: Run race detector
        run: go test -race ./internal/gateway ./internal/helper ./internal/singbox ./internal/session ./internal/socksbridge ./internal/tunnel

      - name: Build Gateway binaries
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X main.version=ci" \
            -o /tmp/kubeloop-gateway-amd64 ./cmd/kubeloop-gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w -X main.version=ci" \
            -o /tmp/kubeloop-gateway-arm64 ./cmd/kubeloop-gateway

      - name: Build privileged helper
        shell: bash
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=ci" \
            -o /tmp/kubeloop-helper ./cmd/kubeloop-helper
          /tmp/kubeloop-helper version

      - name: Cross-compile helper and sing-box packages
        shell: bash
        run: |
          for pair in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${pair%/*} GOARCH=${pair#*/} go build ./internal/singbox
            GOOS=${pair%/*} GOARCH=${pair#*/} go build ./internal/helper
            out="/tmp/kubeloop-helper-${pair%/*}-${pair#*/}"
            if [[ "${pair%/*}" == "windows" ]]; then
              out="${out}.exe"
            fi
            GOOS=${pair%/*} GOARCH=${pair#*/} CGO_ENABLED=0 go build -trimpath \
              -o "${out}" ./cmd/kubeloop-helper
          done

  e2e:
    name: E2E (Minikube)
    needs: go
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.21
        with:
          driver: docker
          cpus: 2
          memory: 4096

      - name: Build and load Gateway image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bin
          CGO_ENABLED=0 GOOS=linux GOARCH="$(go env GOARCH)" go build \
            -trimpath -ldflags="-s -w" \
            -o build/bin/kube-loop-gateway \
            ./cmd/kubeloop-gateway
          eval "$(minikube docker-env --shell bash)"
          docker build -t kube-loop-gateway:dev -f build/gateway.e2e.Dockerfile .

      - name: Run Minikube e2e tests
        shell: bash
        env:
          KUBELOOP_E2E: "1"
          KUBELOOP_E2E_CONTEXT: minikube
          KUBELOOP_GATEWAY_IMAGE: kube-loop-gateway:dev
        run: go test -tags=e2e ./e2e -count=1 -timeout=25m -v

  windows-e2e:
    name: E2E (Windows self-hosted)
    if: ${{ vars.KUBELOOP_WINDOWS_E2E == '1' }}
    needs: go
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    env:
      KUBELOOP_E2E_PROFILE: kubeloop-e2e
      KUBELOOP_E2E_CONTEXT: kubeloop-e2e
      KUBELOOP_GATEWAY_IMAGE: kube-loop-gateway:dev
      KUBELOOP_WINDOWS_MINIKUBE_DRIVER: ${{ vars.KUBELOOP_WINDOWS_MINIKUBE_DRIVER || 'docker' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify runner prerequisites
        shell: pwsh
        run: |
          Get-Command minikube -ErrorAction Stop | Out-Null
          Get-Command kubectl -ErrorAction Stop | Out-Null
          minikube version
          kubectl version --client
          if ($env:KUBELOOP_WINDOWS_MINIKUBE_DRIVER -eq "docker") {
            Get-Command docker -ErrorAction Stop | Out-Null
            docker info
          }

      - name: Start Minikube
        shell: pwsh
        run: |
          minikube start `
            --profile $env:KUBELOOP_E2E_PROFILE `
            --driver $env:KUBELOOP_WINDOWS_MINIKUBE_DRIVER `
            --cpus 2 `
            --memory 4096

      - name: Build and load Gateway image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build `
            -trimpath `
            -ldflags="-s -w" `
            -o build/bin/kube-loop-gateway `
            ./cmd/kubeloop-gateway
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          minikube --profile $env:KUBELOOP_E2E_PROFILE image build `
            --tag $env:KUBELOOP_GATEWAY_IMAGE `
            --file build/gateway.e2e.Dockerfile `
            .

      - name: Run Minikube e2e tests
        shell: pwsh
        env:
          KUBELOOP_E2E: "1"
        run: go test -tags=e2e ./e2e -count=1 -timeout=25m -v

      - name: Collect diagnostics
        if: failure()
        shell: pwsh
        run: |
          minikube --profile $env:KUBELOOP_E2E_PROFILE status
          kubectl --context $env:KUBELOOP_E2E_CONTEXT get pods --all-namespaces -o wide
          kubectl --context $env:KUBELOOP_E2E_CONTEXT `
            -n kubeloop-system logs `
            -l app.kubernetes.io/name=kubeloop-gateway `
            --all-containers `
            --tail=500

      - name: Delete Minikube profile
        if: always()
        shell: pwsh
        run: minikube delete --profile $env:KUBELOOP_E2E_PROFILE
